name: UI Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: dotnet restore SeleniumLab11/SeleniumLab11.csproj

      - name: Run tests (headless)
        run: dotnet test SeleniumLab11/SeleniumLab11.csproj
        env:
          HEADLESS: true

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: SeleniumLab11/bin/Debug/net8.0/allure-results
